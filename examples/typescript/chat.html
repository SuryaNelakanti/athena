<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Athena Chat | Web Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FAF3F7;
      --ink: #0C0C0C;
      --accent: #EC4899;
      --surface: #FFFFFF;
      --border: #0C0C0C;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'IBM Plex Mono', monospace;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      border-bottom: 2px solid var(--border);
      background: var(--surface);
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .logo-icon {
      width: 0; height: 0;
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-bottom: 16px solid var(--accent);
    }

    .accent { color: var(--accent); }

    .status-badge {
      font-size: 0.7rem;
      padding: 4px 8px;
      background: var(--ink);
      color: var(--bg);
      letter-spacing: 0.1em;
    }

    /* Main container */
    .main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 280px;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
      border-left: 2px solid var(--border);
      border-right: 2px solid var(--border);
    }

    /* Chat area */
    .chat-area {
      display: flex;
      flex-direction: column;
      border-right: 2px solid var(--border);
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .message {
      border: 2px solid var(--border);
      padding: 1rem;
      background: var(--surface);
      max-width: 80%;
    }

    .message.user {
      align-self: flex-end;
      background: var(--accent);
      color: white;
    }

    .message.assistant {
      align-self: flex-start;
    }

    .message-header {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 0.5rem;
      opacity: 0.7;
    }

    .message-content {
      line-height: 1.6;
      font-size: 0.9rem;
    }

    .typing-indicator {
      display: none;
      align-self: flex-start;
      border: 2px solid var(--border);
      padding: 1rem;
      background: var(--surface);
    }

    .typing-indicator.active { display: block; }

    .typing-dots span {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: var(--accent);
      margin: 0 2px;
      animation: bounce 1.4s infinite;
    }

    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-6px); }
    }

    /* Input area */
    .input-area {
      padding: 1rem;
      border-top: 2px solid var(--border);
      display: flex;
      gap: 0.5rem;
    }

    .chat-input {
      flex: 1;
      padding: 1rem;
      font-family: inherit;
      font-size: 0.9rem;
      border: 2px solid var(--border);
      background: var(--surface);
      outline: none;
    }

    .chat-input:focus {
      border-color: var(--accent);
    }

    .send-btn {
      padding: 1rem 1.5rem;
      background: var(--accent);
      color: white;
      border: 2px solid var(--border);
      font-family: inherit;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      box-shadow: 4px 4px 0 var(--border);
      transition: transform 0.1s;
    }

    .send-btn:hover {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 var(--border);
    }

    .send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Sidebar */
    .sidebar {
      padding: 1.5rem;
      background: var(--surface);
    }

    .sidebar-section {
      margin-bottom: 2rem;
    }

    .sidebar-title {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      margin-bottom: 1rem;
      color: var(--accent);
    }

    .config-item {
      margin-bottom: 1rem;
    }

    .config-label {
      font-size: 0.75rem;
      margin-bottom: 0.25rem;
      opacity: 0.7;
    }

    .config-input, .config-select {
      width: 100%;
      padding: 0.5rem;
      font-family: inherit;
      font-size: 0.8rem;
      border: 2px solid var(--border);
      background: var(--bg);
    }

    .trace-list {
      max-height: 200px;
      overflow-y: auto;
    }

    .trace-item {
      font-size: 0.7rem;
      padding: 0.5rem;
      background: var(--ink);
      color: var(--bg);
      margin-bottom: 0.25rem;
      word-break: break-all;
    }

    /* Footer */
    .footer {
      padding: 1rem 2rem;
      text-align: center;
      font-size: 0.75rem;
      border-top: 2px solid var(--border);
      background: var(--surface);
      opacity: 0.7;
    }

    /* Streaming text animation */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .stream-char {
      animation: fadeIn 0.1s ease-in;
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="logo">
      <div class="logo-icon"></div>
      Athena <span class="accent">Chat</span>
    </div>
    <div class="status-badge" id="status">CONNECTED</div>
  </header>

  <main class="main">
    <div class="chat-area">
      <div class="messages" id="messages">
        <div class="message assistant">
          <div class="message-header">ATHENA</div>
          <div class="message-content">Hello! I'm connected to the Athena proxy. How can I help you today?</div>
        </div>
      </div>

      <div class="typing-indicator" id="typing">
        <div class="typing-dots">
          <span></span><span></span><span></span>
        </div>
      </div>

      <div class="input-area">
        <input type="text" class="chat-input" id="chatInput" placeholder="Type your message..." autocomplete="off">
        <button class="send-btn" id="sendBtn">SEND</button>
      </div>
    </div>

    <aside class="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-title">⚙️ Configuration</div>
        <div class="config-item">
          <div class="config-label">Athena URL</div>
          <input type="text" class="config-input" id="baseUrl" value="http://localhost:8000">
        </div>
        <div class="config-item">
          <div class="config-label">Model</div>
          <select class="config-select" id="model">
            <option value="gpt-4o-mini">gpt-4o-mini</option>
            <option value="gpt-4o">gpt-4o</option>
            <option value="claude-3-haiku-20240307">claude-3-haiku</option>
          </select>
        </div>
        <div class="config-item">
          <label style="font-size: 0.8rem; display: flex; align-items: center; gap: 0.5rem;">
            <input type="checkbox" id="streamToggle" checked>
            Enable Streaming
          </label>
        </div>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-title">📊 Trace IDs</div>
        <div class="trace-list" id="traceList">
          <div style="font-size: 0.75rem; opacity: 0.5;">No traces yet</div>
        </div>
      </div>
    </aside>
  </main>

  <footer class="footer">
    Powered by Athena SDK • Streaming Web Chat Demo
  </footer>

  <script>
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');
    const typingEl = document.getElementById('typing');
    const traceListEl = document.getElementById('traceList');
    const statusEl = document.getElementById('status');

    let conversationHistory = [];
    let traces = [];

    function addMessage(role, content, streaming = false) {
      const msgEl = document.createElement('div');
      msgEl.className = `message ${role}`;
      msgEl.innerHTML = `
        <div class="message-header">${role === 'user' ? 'YOU' : 'ATHENA'}</div>
        <div class="message-content">${content}</div>
      `;
      messagesEl.appendChild(msgEl);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return msgEl;
    }

    function addTrace(traceId) {
      if (traces.length === 0) {
        traceListEl.innerHTML = '';
      }
      traces.push(traceId);
      const traceEl = document.createElement('div');
      traceEl.className = 'trace-item';
      traceEl.textContent = traceId.substring(0, 24) + '...';
      traceListEl.insertBefore(traceEl, traceListEl.firstChild);
    }

    function generateTraceId() {
      return 'trace_' + crypto.randomUUID();
    }

    async function sendMessage() {
      const content = inputEl.value.trim();
      if (!content) return;

      inputEl.value = '';
      sendBtn.disabled = true;

      addMessage('user', content);
      conversationHistory.push({ role: 'user', content });

      const baseUrl = document.getElementById('baseUrl').value;
      const model = document.getElementById('model').value;
      const streaming = document.getElementById('streamToggle').checked;
      const traceId = generateTraceId();

      typingEl.classList.add('active');

      try {
        const response = await fetch(`${baseUrl}/v1/chat/completions`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Athena-Trace-ID': traceId
          },
          body: JSON.stringify({
            model,
            messages: conversationHistory,
            stream: streaming,
            project_id: 'proj_default'
          })
        });

        typingEl.classList.remove('active');

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        if (streaming) {
          // Handle SSE streaming
          const msgEl = addMessage('assistant', '', true);
          const contentEl = msgEl.querySelector('.message-content');
          let fullContent = '';

          const reader = response.body.getReader();
          const decoder = new TextDecoder();
          let buffer = '';

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split('\n');
            buffer = lines.pop() || '';

            for (const line of lines) {
              if (line.startsWith('data: ')) {
                const data = line.slice(6);
                if (data === '[DONE]') continue;

                try {
                  const chunk = JSON.parse(data);
                  const delta = chunk.choices?.[0]?.delta?.content || '';
                  fullContent += delta;
                  contentEl.textContent = fullContent;
                  messagesEl.scrollTop = messagesEl.scrollHeight;
                } catch (e) {}
              }
            }
          }

          conversationHistory.push({ role: 'assistant', content: fullContent });
        } else {
          // Non-streaming response
          const data = await response.json();
          const assistantContent = data.choices[0].message.content;
          addMessage('assistant', assistantContent);
          conversationHistory.push({ role: 'assistant', content: assistantContent });
        }

        addTrace(traceId);
        statusEl.textContent = 'CONNECTED';
        statusEl.style.background = 'var(--ink)';

      } catch (error) {
        typingEl.classList.remove('active');
        addMessage('assistant', `Error: ${error.message}. Make sure Athena backend is running.`);
        statusEl.textContent = 'ERROR';
        statusEl.style.background = '#EF4444';
      }

      sendBtn.disabled = false;
      inputEl.focus();
    }

    sendBtn.addEventListener('click', sendMessage);
    inputEl.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    inputEl.focus();
  </script>
</body>
</html>
