<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link
    rel="icon"
    type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%238D7CE4'/%3E%3Ctext x='16' y='21' text-anchor='middle' font-family='Arial' font-size='18' fill='white'%3EA%3C/text%3E%3C/svg%3E"
  />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Athena - AI Observability Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700;800;900&family=EB+Garamond:ital,wght@0,400..800;1,400..800&display=swap"
    rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Figtree', 'sans-serif'],
            serif: ['EB Garamond', 'serif'],
          },
          colors: {
            // Semantic Colors (Themed)
            app: 'var(--bg-app)',
            panel: 'var(--bg-panel)',
            'panel-hover': 'var(--bg-panel-hover)',
            text: {
              main: 'var(--text-main)',
              muted: 'var(--text-muted)',
              inverted: 'var(--text-inverted)',
            },
            border: {
              base: 'var(--border-base)',
              hover: 'var(--border-hover)',
            },

            wispr: {
              purple: '#8D7CE4',
              'purple-light': '#A597ED',
              'purple-dark': '#7565C8',
            },
            emerald: {
              500: '#10b981',
            },

            // Legacy/Specific Palette access if needed
            gofun: '#FFFFFC',
            shironeri: '#F3F3F2',
            ink: {
              900: '#1a1a1a',
            }
          }
        },
      },
    }
  </script>
  <style>
    :root {
      /* Light Mode (Lumen) */
      --bg-app: #FDFCFB;
      --bg-panel: #F7F2EF;
      --bg-panel-hover: #EFE9E4;
      --text-main: #1D1D1F;
      --text-muted: #6E6E73;
      --text-inverted: #FFFFFF;
      --border-base: #E8E5E1;
      --border-hover: #D8D4CF;
      --accent-primary: #8D7CE4;
    }

    .dark {
      /* Dark Mode (Pulse) */
      --bg-app: #0C0C0C;
      --bg-panel: #141414;
      --bg-panel-hover: #1D1D1F;
      --text-main: #F5F5F7;
      --text-muted: #A1A1A6;
      --text-inverted: #0C0C0C;
      --border-base: #262626;
      --border-hover: #333333;
      --accent-primary: #8D7CE4;
    }

    body {
      background-color: var(--bg-app);
      color: var(--text-main);
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg-app);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border-base);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--border-hover);
    }
  </style>


</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/index.tsx"></script>
</body>

</html>
