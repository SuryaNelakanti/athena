<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="https://picsum.photos/32/32" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Athena - AI Observability Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            // Semantic Colors (Themed)
            app: 'var(--bg-app)',
            panel: 'var(--bg-panel)',
            'panel-hover': 'var(--bg-panel-hover)',
            text: {
              main: 'var(--text-main)',
              muted: 'var(--text-muted)',
              inverted: 'var(--text-inverted)',
            },
            border: {
              base: 'var(--border-base)',
              hover: 'var(--border-hover)',
            },

            // Accents (Keep specific ones available)
            indigo: {
              500: '#6366f1',
              600: '#4f46e5',
            },
            rose: {
              500: '#f43f5e',
            },
            emerald: {
              500: '#10b981',
            },

            // Legacy/Specific Palette access if needed
            gofun: '#FFFFFC',
            shironeri: '#F3F3F2',
            ink: {
              900: '#1a1a1a',
            }
          }
        },
      },
    }
  </script>
  <style>
    :root {
      /* Light Mode (Japanese Nuevo Tokyo) */
      --bg-app: #FFFFFC;
      /* Gofun */
      --bg-panel: #F3F3F2;
      /* Shironeri */
      --bg-panel-hover: #EAE5E3;
      /* Soshoku */
      --text-main: #1a1a1a;
      /* Ink 900 */
      --text-muted: #4a4a4a;
      /* Ink 600 */
      --text-inverted: #ffffff;
      --border-base: #E5E4E6;
      /* Shiraumenezu */
      --border-hover: #E7E7EB;
      /* Murasakisuishiyou */
    }

    .dark {
      /* Dark Mode (Cinematic Void) */
      --bg-app: #0d1117;
      /* Gray 950 */
      --bg-panel: #161b22;
      /* Gray 900 */
      --bg-panel-hover: #21262d;
      /* Gray 850 */
      --text-main: #c9d1d9;
      /* Gray 100 */
      --text-muted: #8b949e;
      /* Gray 400 */
      --text-inverted: #0d1117;
      --border-base: #30363d;
      /* Gray 700 */
      --border-hover: #6e7681;
      /* Gray 600 */
    }

    body {
      background-color: var(--bg-app);
      color: var(--text-main);
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg-app);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border-base);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--border-hover);
    }
  </style>


</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/index.tsx"></script>
</body>

</html>
